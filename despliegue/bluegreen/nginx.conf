# Puerto 80 (publicado en 8080): produccion, apunta al entorno activo
server {
  listen 80;
  resolver 127.0.0.11 valid=5s;
  include /etc/nginx/gw/active.inc;

  location /api/ { proxy_pass $api_upstream; }
  location /     { proxy_pass $web_upstream; }
}

# Puerto 81 (publicado en 8081): prueba, siempre apunta a green
server {
  listen 81;
  resolver 127.0.0.11 valid=5s;
  set $api_upstream http://api-green:5000;
  set $web_upstream http://web-green:80;

  location /api/ { proxy_pass $api_upstream; }
  location /     { proxy_pass $web_upstream; }
}