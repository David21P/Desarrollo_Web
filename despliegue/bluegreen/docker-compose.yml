x-api-env: &api-env
  - MONGO_URI=mongodb://mongo:27017/ferreteria
  - PORT=5000
  - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET en el archivo .env}
  - JWT_EXPIRES_IN=5m

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  api-blue:
    image: ferreteria-api:v1
    environment: *api-env
    depends_on: [mongo]
  web-blue:
    image: ferreteria-web:v1

  api-green:
    image: ferreteria-api:v2
    environment: *api-env
    depends_on: [mongo]
  web-green:
    image: ferreteria-web:v2

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8081:81"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway:/etc/nginx/gw:ro
    depends_on: [api-blue, web-blue]

volumes:
  mongo-data: