services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  api:
    image: ferreteria-api:${VERSION:-v1}
    environment:
      - MONGO_URI=mongodb://mongo:27017/ferreteria
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET en el archivo .env}
      - JWT_EXPIRES_IN=5m
    depends_on:
      - mongo

  web:
    image: ferreteria-web:${VERSION:-v1}

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  mongo-data: